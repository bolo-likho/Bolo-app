name: Build Android App

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Unzip project
      run: |
        mkdir project
        unzip -q *.zip -d project

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v4
      with:
        gradle-version: '8.7'

    - name: Build Debug APK
      run: |
        cd project
        # Automatically find the folder containing gradlew
        APP_DIR=$(find . -name "gradlew" -maxdepth 3 -exec dirname {} \;)
        echo "Found app dir: $APP_DIR"
        cd "$APP_DIR"
        chmod +x gradlew
        ./gradlew assembleDebug --no-daemon

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: project/**/build/outputs/apk/debug/app-debug.apk
